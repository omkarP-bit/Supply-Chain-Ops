version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: scops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-supply_chain}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scops} -d ${POSTGRES_DB:-supply_chain}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: scops-backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    container_name: scops-worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      WORKER_MODE: "1"
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: scops-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
